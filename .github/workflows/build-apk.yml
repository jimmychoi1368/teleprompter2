name: 题词器APK构建（最终稳定版）

on: [push]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      # 步骤1：拉取代码（含Vosk资源）
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      # 步骤2：检查Vosk资源（确保路径正确）
      - name: 检查Vosk资源
        run: |
          if [ ! -f "libs/vosk-android-0.3.70.aar" ]; then echo "Vosk AAR缺失" && exit 1; fi
          if [ ! -d "assets/vosk-model-small-en-us-0.15" ]; then echo "Vosk模型文件夹缺失" && exit 1; fi

      # 步骤3：用预配置的Buildozer环境构建（跳过手动装依赖）
      - name: 构建APK（预配置环境）
        uses: mydzor/buildozer-action@v1.5.0
        with:
          command: android debug
          buildozer_version: 1.5.0
          python_version: 3.10

      # 步骤4：上传APK
      - name: 上传APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
