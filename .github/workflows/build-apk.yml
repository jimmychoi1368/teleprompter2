name: Build Teleprompter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libmtdev-dev \
          xclip \
          xsel \
          libtool \
          pkg-config \
          autoconf \
          automake \
          cmake \
          libffi-dev \
          libssl-dev \
          zip \
          unzip \
          wget

    - name: Install Buildozer and dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0
        pip install cython==0.29.36
        pip install virtualenv

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}-v3
        restore-keys: |
          buildozer-global-

    - name: Cache .buildozer local directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ hashFiles('buildozer.spec') }}-v3
        restore-keys: |
          buildozer-local-

    - name: Download Vosk Model (English Small 40MB)
      run: |
        mkdir -p assets/vosk_model
        cd assets/vosk_model
        wget -q --show-progress https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -O model.zip
        unzip -q model.zip
        mv vosk-model-small-en-us-0.15/* .
        rm -rf vosk-model-small-en-us-0.15 model.zip
        ls -la
        cd ../..

    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        yes | buildozer android debug 2>&1 | tee build.log

    - name: Find and Upload APK
      run: |
        APK_PATH=$(find bin -name "*.apk" 2>/dev/null | head -1)
        if [ -n "$APK_PATH" ]; then
          echo "APK_FOUND=true" >> $GITHUB_ENV
          echo "APK built successfully: $APK_PATH"
          ls -lh bin/
        else
          echo "APK_FOUND=false" >> $GITHUB_ENV
          echo "Build may have failed. Last 200 lines of log:"
          tail -200 build.log
        fi

    - name: Upload APK artifact
      if: env.APK_FOUND == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: teleprompter-release
        path: bin/*.apk
        retention-days: 90

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 14
