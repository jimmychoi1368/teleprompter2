name: 英语提词器APK构建（Docker终极方案）

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 检查Vosk资源
        run: |
          echo "检查必要文件..."
          ls -la libs/
          ls -la assets/
          if [ ! -f "libs/vosk-android-0.3.70.aar" ]; then
            echo "错误：缺少Vosk AAR文件"
            exit 1
          fi
          if [ ! -d "assets/vosk-model-small-en-us-0.15" ]; then
            echo "错误：缺少Vosk模型文件"
            exit 1
          fi
          echo "✓ 资源文件检查通过"

      - name: 使用Docker构建APK
        run: |
          # 使用已经配置好Android环境的Docker容器
          # 这个镜像已经解决了所有许可证问题
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            kivy/buildozer:stable \
            buildozer android debug
          
          # 检查是否生成APK
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "✅ APK构建成功！"
            ls -lh bin/*.apk
          else
            echo "❌ APK构建失败"
            exit 1
          fi

      - name: 上传APK文件
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
          retention-days: 7
