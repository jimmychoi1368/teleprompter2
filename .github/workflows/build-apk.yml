name: 英语提词器APK构建

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 检查Vosk资源
        run: |
          ls libs/
          ls assets/
          test -f "libs/vosk-android-0.3.70.aar"
          test -d "assets/vosk-model-small-en-us-0.15"
          echo "资源文件检查通过"

      - name: 使用Docker构建APK
        run: |
          echo "开始构建APK..."
          
          # 直接使用ubuntu镜像，安装必要工具
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            ubuntu:22.04 \
            /bin/bash -c "
              apt-get update && \
              apt-get install -y python3-pip git wget zip unzip openjdk-11-jdk && \
              pip3 install buildozer==1.5.0 cython==0.29.28 && \
              echo 'y' | BUILDOZER_ALLOW_ROOT=1 buildozer -y android debug
            "
          
          # 检查是否生成APK
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "✅ APK构建成功！"
            ls -lh bin/*.apk
          else
            echo "❌ APK构建失败"
            exit 1
          fi

      - name: 上传APK文件
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
