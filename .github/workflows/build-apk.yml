name: 英语提词器APK构建

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 检查Vosk资源
        run: |
          ls libs/
          ls assets/
          test -f "libs/vosk-android-0.3.70.aar"
          test -d "assets/vosk-model-small-en-us-0.15"
          echo "资源文件检查通过"

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y python3-pip git wget zip unzip openjdk-11-jdk

      - name: 安装Android SDK
        run: |
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip
          
          # 创建正确的目录结构
          mkdir -p android-sdk/cmdline-tools/latest
          mv cmdline-tools/* android-sdk/cmdline-tools/latest/
          rmdir cmdline-tools
          
          # 设置环境变量
          echo "ANDROID_SDK_ROOT=$PWD/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$PWD/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV

      - name: 接受Android许可证（简单版）
        run: |
          # 创建必要的目录和文件
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # 使用echo自动接受所有许可证
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses

      - name: 安装Android组件
        run: |
          # 安装组件，每个都指定SDK根目录
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-31"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;33.0.2"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "ndk;23.1.7779620"

      - name: 安装Buildozer
        run: |
          pip3 install buildozer==1.5.0
          pip3 install cython==0.29.28

      - name: 构建APK
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug

      - name: 上传APK文件
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
