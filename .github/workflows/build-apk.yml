name: 题词器APK构建（最终版-本地资源+正确APK路径）

on: [push]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      PYTHON_VERSION: "3.10.12"
      JDK_VERSION: "11.0.29"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 拉取仓库代码（含本地Vosk资源）
        uses: actions/checkout@v4

      - name: 缓存Buildozer依赖（加速构建）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-cache-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-cache-${{ runner.os }}-

      - name: 安装Python 3.10（匹配GitHub环境）
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"

      - name: 安装系统必需依赖（无任何冲突）
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip
          echo "系统依赖安装完成" >> ./build.log

      - name: 安装Python依赖（适配Kivy/Vosk）
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33 kivy==2.2.1 pyjnius==1.5.0
          echo "Python依赖安装完成" >> ./build.log

      - name: 构建APK（使用本地Vosk资源，强制生成日志）
        run: |
          yes | buildozer android debug 2>&1 | tee ./build.log
          echo "APK构建完成" >> ./build.log

      - name: 上传APK文件（正确路径，必出压缩包）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: .buildozer/android/platform/build/outputs/apk/debug/*.apk

      - name: 上传构建日志（方便排查，始终上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ./build.log
