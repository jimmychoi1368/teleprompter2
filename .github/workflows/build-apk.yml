name: 题词器APK构建（本地Vosk资源方案）

on: [push]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      PYTHON_VERSION: "3.10.12"
      JDK_VERSION: "11.0.29"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 拉取仓库代码（含本地Vosk资源）
        uses: actions/checkout@v4

      - name: 缓存Buildozer依赖
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-cache-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-cache-${{ runner.os }}-

      - name: 安装Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"

      - name: 安装系统必需依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip
          echo "系统依赖安装完成" >> ./build.log

      - name: 安装Python依赖
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33 kivy==2.2.1 pyjnius==1.5.0
          echo "Python依赖安装完成" >> ./build.log

      - name: 检查本地Vosk资源
        run: |
          echo "检查libs目录..." >> ./build.log
          ls -la libs/ >> ./build.log 2>&1 || echo "libs目录不存在" >> ./build.log
          echo "检查assets目录..." >> ./build.log
          ls -la assets/ >> ./build.log 2>&1 || echo "assets目录不存在" >> ./build.log

      - name: 构建APK（使用本地Vosk资源）
        run: |
          yes | buildozer android debug 2>&1 | tee ./build.log
          echo "APK构建完成" >> ./build.log

      - name: 上传APK文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ./build.log
