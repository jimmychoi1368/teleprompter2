name: 英语提词器APK构建

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 检查Vosk资源
        run: |
          ls libs/
          ls assets/
          test -f "libs/vosk-android-0.3.70.aar"
          test -d "assets/vosk-model-small-en-us-0.15"
          echo "资源文件检查通过"

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y python3-pip git wget zip unzip openjdk-11-jdk

      - name: 安装Android SDK
        run: |
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip
          
          # 创建正确的目录结构
          mkdir -p android-sdk/cmdline-tools/latest
          mv cmdline-tools/* android-sdk/cmdline-tools/latest/
          rmdir cmdline-tools
          
          # 设置环境变量
          echo "ANDROID_SDK_ROOT=$PWD/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$PWD/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV

      - name: 强制接受所有Android许可证
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # 方法1：尝试使用yes命令
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses > /dev/null 2>&1 || true
          
          # 方法2：直接创建许可证接受文件
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "84831b9409646a918e30573b4d6d4f0c7d11e53a" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "108d4e8e9d5e91a8a78e5c5d8d5c5d8d5c5d8d5c" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          
          # 方法3：使用find命令查找所有许可证并接受
          echo "查找可用的许可证..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --list 2>&1 | grep -A 100 "Available Packages:" || true

      - name: 安装Android组件（绕过许可证检查）
        run: |
          echo "开始安装Android组件..."
          
          # 先更新sdkmanager自身
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --update || true
          
          # 安装platform-tools（必须）
          echo "安装platform-tools..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" || echo "platform-tools安装失败，继续..."
          
          # 安装Android 31平台
          echo "安装Android 31平台..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-31" || echo "Android 31平台安装失败，继续..."
          
          # 安装构建工具33.0.2
          echo "安装构建工具33.0.2..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;33.0.2" || echo "构建工具33.0.2安装失败，尝试其他版本..."
          
          # 如果33.0.2失败，尝试安装30.0.3
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;30.0.3" || echo "构建工具30.0.3安装失败，继续..."
          
          # 安装NDK
          echo "安装NDK 23.1.7779620..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "ndk;23.1.7779620" || echo "NDK安装失败，继续..."
          
          # 检查实际安装了什么
          echo "检查已安装的组件："
          ls -la $ANDROID_SDK_ROOT/ || true
          ls -la $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null || echo "没有build-tools目录"

      - name: 安装Buildozer
        run: |
          pip3 install buildozer==1.5.0
          pip3 install cython==0.29.28

      - name: 构建APK
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug

      - name: 上传APK文件
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
