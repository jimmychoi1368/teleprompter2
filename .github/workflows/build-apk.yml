name: Build Teleprompter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install minimal system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          wget \
          curl \
          autoconf \
          libtool \
          pkg-config \
          libffi-dev \
          libssl-dev \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          liblzma-dev \
          libsqlite3-dev \
          libreadline-dev \
          libbz2-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0
        pip install cython==0.29.36
        pip install virtualenv

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}-v4
        restore-keys: |
          buildozer-global-

    - name: Cache .buildozer local directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ hashFiles('buildozer.spec') }}-v4
        restore-keys: |
          buildozer-local-

    - name: Download Vosk AAR Package
      run: |
        mkdir -p libs
        wget -q https://repo1.maven.org/maven2/com/alphacephei/vosk-android/0.3.47/vosk-android-0.3.47.aar -O libs/vosk-android-0.3.47.aar
        echo "Vosk AAR downloaded:"
        ls -lh libs/

    - name: Download Vosk Model (English Small)
      run: |
        mkdir -p assets/vosk_model
        cd assets/vosk_model
        wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -O model.zip
        unzip -q model.zip
        mv vosk-model-small-en-us-0.15/* .
        rm -rf vosk-model-small-en-us-0.15 model.zip
        echo "Vosk model files:"
        ls -la
        cd ../..

    - name: Build APK with Buildozer
      run: |
        yes | buildozer android debug 2>&1 | tee build.log
      env:
        ANDROID_HOME: ~/.buildozer/android/platform/android-sdk
        ANDROID_SDK_ROOT: ~/.buildozer/android/platform/android-sdk

    - name: Check build result
      if: always()
      run: |
        echo "===== Build directory contents ====="
        ls -la
        echo ""
        if [ -d "bin" ]; then
          echo "===== APK files found ====="
          ls -lh bin/ || echo "bin directory empty"
          APK_COUNT=$(find bin -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -gt 0 ]; then
            echo "SUCCESS: $APK_COUNT APK file(s) built!"
          else
            echo "WARNING: No APK files in bin/"
          fi
        else
          echo "WARNING: bin directory not found"
        fi

    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: teleprompter-apk
        path: bin/*.apk
        if-no-files-found: ignore
        retention-days: 90

    - name: Upload build log (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 30

    - name: Upload buildozer log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-logs
        path: |
          .buildozer/logs/
          .buildozer/android/platform/python-for-android/dists/*/logs/
        if-no-files-found: ignore
        retention-days: 14
