name: 英语提词器APK构建

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 检查Vosk资源
        run: |
          ls libs/
          ls assets/
          test -f "libs/vosk-android-0.3.70.aar"
          test -d "assets/vosk-model-small-en-us-0.15"
          echo "资源文件检查通过"

      - name: 安装Python和Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git zip unzip
          pip3 install buildozer==1.5.0 cython==0.29.28

      - name: 设置Android SDK
        run: |
          chmod +x android-setup.sh
          ./android-setup.sh
          echo "ANDROID_SDK_ROOT=$PWD/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV

      - name: 构建APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          BUILDOZER_ALLOW_ROOT: 1
        run: |
          echo "开始构建APK..."
          buildozer android clean || true
          echo "y" | buildozer -y android debug
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "✅ APK构建成功！"
            ls -lh bin/*.apk
          else
            echo "❌ APK构建失败"
            exit 1
          fi

      - name: 上传APK文件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
