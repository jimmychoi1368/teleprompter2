name: 题词器APK构建（修复Buildozer构建）

on: [push]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      PYTHON_VERSION: "3.10.12"
      JDK_VERSION: "11.0.29"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 拉取仓库代码（含本地Vosk资源）
        uses: actions/checkout@v4

      - name: 检查Vosk资源是否存在
        run: |
          if [ ! -f "libs/vosk-android-0.3.70.aar" ]; then echo "Vosk AAR缺失" && exit 1; fi
          if [ ! -d "assets/vosk-model-small-en-us-0.15" ]; then echo "Vosk模型缺失" && exit 1; fi
          echo "Vosk资源完整" >> ./build.log

      - name: 清理Buildozer旧缓存
        run: |
          rm -rf ~/.buildozer
          echo "旧缓存已清理" >> ./build.log

      - name: 安装Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"

      - name: 安装系统必需依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-11-jdk
          echo "系统依赖安装完成" >> ./build.log

      - name: 安装Python依赖（升级Buildozer）
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.1 cython==0.29.33 kivy==2.2.1 pyjnius==1.5.0 setuptools
          echo "Python依赖安装完成" >> ./build.log

      - name: 构建APK（显示详细日志）
        run: |
          buildozer android debug -v 2>&1 | tee ./build.log
          if [ ! -f "$(find . -name "*.apk" | head -n 1)" ]; then echo "APK构建失败" && exit 1; fi
          echo "APK构建成功" >> ./build.log

      - name: 上传APK文件（覆盖所有路径）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: ./**/*.apk

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ./build.log
