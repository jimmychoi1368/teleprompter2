name: 英语提词器APK构建

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 检查Vosk资源
        run: |
          ls libs/
          ls assets/
          test -f "libs/vosk-android-0.3.70.aar"
          test -d "assets/vosk-model-small-en-us-0.15"
          echo "资源文件检查通过"

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y python3-pip git wget zip unzip openjdk-11-jdk

      - name: 安装Android SDK
        run: |
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip
          
          # 创建正确的目录结构：android-sdk/cmdline-tools/latest/
          mkdir -p android-sdk/cmdline-tools/latest
          mv cmdline-tools/* android-sdk/cmdline-tools/latest/
          rmdir cmdline-tools
          
          # 设置环境变量
          echo "ANDROID_SDK_ROOT=$PWD/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$PWD/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV
          
          echo "Android SDK目录结构："
          find android-sdk -type f -name "sdkmanager" 2>/dev/null

      - name: 接受Android许可证（终极方案）
        run: |
          # 创建一个脚本自动接受所有许可证
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # 使用yes命令自动接受所有许可证
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
          
          # 如果上面失败，尝试使用expect自动输入y
          sudo apt-get install -y expect > /dev/null 2>&1
          
          cat > accept_all_licenses.exp << 'EOF'
#!/usr/bin/expect
set timeout -1
spawn $env(ANDROID_SDK_ROOT)/cmdline-tools/latest/bin/sdkmanager --sdk_root=$env(ANDROID_SDK_ROOT) --licenses
expect {
  "y/N" { send "y\r"; exp_continue }
  eof
}
EOF
          
          chmod +x accept_all_licenses.exp
          ./accept_all_licenses.exp
          
          echo "所有许可证已接受"

      - name: 安装Android组件（指定版本）
        run: |
          # 先安装platform-tools
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools"
          
          # 安装Android 31平台
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-31"
          
          # 特别注意：先安装构建工具33.0.2
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;33.0.2"
          
          # 如果33.0.2失败，尝试安装其他版本
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;30.0.3" || true
          
          # 安装NDK 23.1.7779620
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "ndk;23.1.7779620"
          
          echo "检查已安装的构建工具："
          ls -la $ANDROID_SDK_ROOT/build-tools/

      - name: 安装Buildozer
        run: |
          pip3 install buildozer==1.5.0
          pip3 install cython==0.29.28

      - name: 构建APK
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug

      - name: 上传APK文件
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
