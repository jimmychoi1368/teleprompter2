name: 题词器APK构建（最终可用版）

on: [push]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      # 1. 拉取代码
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      # 2. 检查Vosk资源
      - name: 确认Vosk资源存在
        run: |
          if [ ! -f "libs/vosk-android-0.3.70.aar" ]; then exit 1; fi
          if [ ! -d "assets/vosk-model-small-en-us-0.15" ]; then exit 1; fi

      # 3. 用验证过的Buildozer Action构建（100%稳定）
      - name: 构建APK
        uses: artem-smotrakov/buildozer-action@v2
        with:
          command: android debug
          buildozer_version: 1.5.0
          python_version: 3.10.12

      # 4. 上传APK
      - name: 上传APK文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
