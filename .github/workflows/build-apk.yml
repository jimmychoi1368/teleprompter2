name: 英语提词器APK构建（Docker终极方案）

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 检查Vosk资源
        run: |
          echo "检查必要文件..."
          ls -la libs/
          ls -la assets/
          if [ ! -f "libs/vosk-android-0.3.70.aar" ]; then
            echo "错误：缺少Vosk AAR文件"
            exit 1
          fi
          if [ ! -d "assets/vosk-model-small-en-us-0.15" ]; then
            echo "错误：缺少Vosk模型文件"
            exit 1
          fi
          echo "✓ 资源文件检查通过"

      - name: 使用Docker构建APK
        run: |
          echo "开始使用Docker构建APK..."
          
          # 方法1：尝试kivy/buildozer官方镜像（标签改为latest）
          echo "尝试kivy/buildozer:latest镜像..."
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            kivy/buildozer:latest \
            buildozer android debug 2>&1 | tee docker_build.log || echo "镜像1失败，尝试镜像2..."
          
          # 方法2：如果第一个镜像失败，尝试beevelop/android镜像
          if ! ls bin/*.apk 1> /dev/null 2>&1; then
            echo "尝试beevelop/android:latest镜像..."
            docker run --rm \
              -v $PWD:/app \
              -w /app \
              beevelop/android:latest \
              /bin/bash -c "pip install buildozer==1.5.0 cython==0.29.28 && buildozer android debug" 2>&1 | tee docker_build2.log || echo "镜像2失败，尝试镜像3..."
          fi
          
          # 方法3：如果前两个都失败，使用ubuntu镜像手动安装
          if ! ls bin/*.apk 1> /dev/null 2>&1; then
            echo "使用ubuntu手动安装环境..."
            docker run --rm \
              -v $PWD:/app \
              -w /app \
              ubuntu:22.04 \
              /bin/bash -c "
                apt-get update && apt-get install -y python3-pip git wget zip unzip openjdk-11-jdk && \
                pip3 install buildozer==1.5.0 cython==0.29.28 && \
                buildozer android debug
              " 2>&1 | tee docker_build3.log
          fi
          
          # 检查是否生成APK
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "✅ APK构建成功！"
            ls -lh bin/*.apk
          else
            echo "❌ APK构建失败，查看日志："
            tail -100 docker_build*.log 2>/dev/null || echo "无日志文件"
            exit 1
          fi

      - name: 上传APK文件
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
          retention-days: 7
