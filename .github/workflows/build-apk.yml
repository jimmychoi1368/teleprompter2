name: 英语提词器APK构建（稳定版）

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      # 1. 拉取代码
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      # 2. 检查Vosk资源
      - name: 确认Vosk资源存在
        run: |
          echo "检查Vosk资源..."
          if [ ! -f "libs/vosk-android-0.3.70.aar" ]; then
            echo "错误：缺少Vosk AAR文件"
            exit 1
          fi
          if [ ! -d "assets/vosk-model-small-en-us-0.15" ]; then
            echo "错误：缺少Vosk模型文件"
            exit 1
          fi
          echo "✓ Vosk资源检查通过"

      # 3. 安装系统依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            openjdk-11-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            ninja-build
          echo "Java版本："
          java -version

      # 4. 安装Python依赖
      - name: 安装Python依赖
        run: |
          python3 --version
          pip3 install --user buildozer==1.5.0
          pip3 install --user cython==0.29.28
          echo "Buildozer版本："
          ~/.local/bin/buildozer --version

      # 5. 设置Android SDK/NDK - 简化版
      - name: 设置Android SDK/NDK
        run: |
          # 安装Android SDK和命令行工具的最简单方法
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip
          
          # 移动cmdline-tools到正确位置
          mkdir -p android-sdk
          mv cmdline-tools android-sdk/
          
          # 设置环境变量
          echo "ANDROID_SDK_ROOT=$PWD/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$PWD/android-sdk/cmdline-tools/bin" >> $GITHUB_ENV
          
          # 接受许可证
          echo "y" | ./android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=./android-sdk --licenses
          
          # 安装必要组件（一个一个安装，避免超时）
          ./android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=./android-sdk "platform-tools"
          ./android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=./android-sdk "platforms;android-31"
          ./android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=./android-sdk "build-tools;33.0.2"
          ./android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=./android-sdk "ndk;23.1.7779620"
          
          echo "Android SDK安装完成"
          echo "SDK根目录：$ANDROID_SDK_ROOT"

      # 6. 构建APK - 修复版
      - name: 构建APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          echo "开始构建APK..."
          
          # 设置PATH
          export PATH=$PATH:~/.local/bin
          
          # 先初始化Buildozer环境（不执行clean）
          echo "初始化Buildozer环境..."
          buildozer android update 2>&1 | tee init.log
          
          # 检查初始化是否成功
          if [ -d ".buildozer/android/platform" ]; then
            echo "✓ Buildozer环境初始化成功"
          else
            echo "✗ Buildozer环境初始化失败"
            echo "初始化日志："
            cat init.log
            exit 1
          fi
          
          # 开始构建（跳过clean步骤，避免删除刚初始化的环境）
          echo "开始构建APK..."
          buildozer -v android debug 2>&1 | tee build_output.txt
          
          # 检查结果
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "✅ APK构建成功！"
            ls -lh bin/*.apk
          else
            echo "❌ APK构建失败"
            echo "最后50行构建日志："
            tail -50 build_output.txt
            exit 1
          fi

      # 7. 上传APK
      - name: 上传APK文件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: bin/*.apk
          retention-days: 7
